name: mobile
description: "Homestay Management App"
publish_to: 'none'
version: 1.0.1+12

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.8.0+1

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  table_calendar: ^3.1.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.12
  intl: ^0.19.0

  # Camera + on-device ML (KYC CCCD + selfie scanner)
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_barcode_scanning: ^0.14.0
  image: ^4.3.0

  # Animation
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  lottie: ^3.1.0

  # Charts (Báo cáo screen)
  fl_chart: ^0.69.2

  # Typography
  google_fonts: ^6.2.1

  # Map
  url_launcher: ^6.3.1
  # Lấy vị trí hiện tại (GPS) cho cơ sở khi tạo/sửa phòng.
  # KHÔNG cần Google Maps API key / billing — chỉ đọc GPS thiết bị.
  geolocator: ^13.0.1

  # Share
  share_plus: ^10.1.4

  # Splash
  flutter_native_splash: ^2.4.0

  # Auth
  google_sign_in: ^6.2.2
  # Sign In with Apple — bắt buộc nếu app có third-party login (Google) per
  # Apple Guideline 4.8. Chỉ active trên iOS/macOS, Android fallback web flow.
  sign_in_with_apple: ^6.1.2

  # Firebase + Push Notifications (FCM) + Crashlytics
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^17.2.3

  # SVG
  flutter_svg: ^2.0.10+1

  # QR rendering (VNPay QR + VietQR payment screens)
  qr_flutter: ^4.1.0

  # Utils
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5

  # Device info (X-Device-Id header cho anti-spam ở /auth/register, /auth/google)
  device_info_plus: ^11.1.1

  # App version (force-update + Crashlytics context)
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  mocktail: ^1.0.4

# Pin path_provider_foundation < 2.6.0. From 2.6.0 it pulls the `objective_c`
# package, which ships a prebuilt dynamic `objective_c.framework` whose
# signature is invalid on physical devices → install fails with
# "0xe8008014 (The executable contains an invalid signature.)".
# 2.5.1 has no objective_c dependency and satisfies path_provider's ^2.3.2.
# Revisit once the upstream signing issue (dart-lang/native) is fixed.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  # Liệt kê tường minh để KHÔNG bundle splash_android12.png vào IPA — Apple
  # static-scan reject (guideline 2.3.10) khi asset filename chứa "android".
  # File đó chỉ dùng build-time cho flutter_native_splash gen Android resource,
  # không cần ship trong Flutter asset bundle iOS.
  assets:
    - assets/images/google_logo.svg
    - assets/images/halong24h-app-icon.png
    - assets/images/logo_splash.png
    - assets/images/logohalong24h.png
    - assets/images/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/halong24h-app-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#062D42"
  adaptive_icon_foreground: "assets/images/halong24h-app-icon.png"

flutter_native_splash:
  color: "#062D42"
  image: assets/images/splash.png
  android_12:
    color: "#062D42"
    image: assets/images/splash_android12.png
    icon_background_color: "#062D42"
