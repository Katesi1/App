name: mobile
description: "Homestay Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.8.0+1

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  table_calendar: ^3.1.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.12
  intl: ^0.19.0

  # Animation
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  lottie: ^3.1.0

  # Typography
  google_fonts: ^6.2.1

  # Map
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.1.4

  # Utils
  equatable: ^2.0.7
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
